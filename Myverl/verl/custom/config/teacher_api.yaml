# Standalone teacher-API rephraser config.
#
# Loaded INDEPENDENTLY of the trainer's Hydra config (see
# verl/custom/teacher_api_client.py::load_teacher_config). API-calling params
# live only here and never mix with training hyperparameters.
#
# Location: this file by default; override the path via env TEACHER_API_CONFIG.
# enable=True is the single master switch: it also makes the train dataset keep
# the raw summarize messages automatically (no separate data flag needed).
#
# api_key: leave empty and use env TEACHER_API_KEY / DASHSCOPE_API_KEY instead —
# do NOT commit secrets.
#
# NOTE: no behavior logprob is available for teacher content, so off_old_log_probs
# / target_probs stay zero -> the off-row loss must be a behavior-logprob-free
# mode (off_policy_reshape in {vanilla, rl-sft}); 'luffy' is rejected at startup.

enable: False           # master switch; OVERRIDDEN by env TEACHER_API_ENABLE when set (from the train script)

# --- endpoint (OpenAI-compatible /v1/chat/completions) ---
url: ""                 # single endpoint; empty -> use api_list
api_list: []            # multiple endpoints, round-robined per request
api_key: ""             # empty -> read env TEACHER_API_KEY / DASHSCOPE_API_KEY

# --- input data ---
# Dataset column holding the teacher's OWN pre-rendered chat prompts (a per-row
# array of K messages-arrays), built by a dedicated offline script — kept SEPARATE
# from the policy's `summarize_prompts`. The trainer reads only this column when
# building teacher requests. Falls back to decoding the summarize prompt only if
# this column is absent.
prompt_key: "teacher_prompts"

# --- generation ---
model: "Qwen3-235B-A22B-Instruct-2507"
threads: 100            # concurrent requests
retry: 3                # retries per request (exponential backoff)
timeout: 1500           # seconds per request
temperature: 0.7
top_p: 0.95
max_tokens: 16384
enable_thinking: False  # chat_template_kwargs.enable_thinking

# --- observability / bounded wait ---
# batch_chat prints progress as requests COMPLETE (not in submit order), so a slow
# teacher looks different from a hung one. Without these the call is fully silent
# until the last request returns: worst case retry=3 x timeout=1500 = 100 min per
# wave with zero output, which is indistinguishable from a deadlock.
log_every: 0            # print every N completions; 0 -> auto (每 10%)
log_interval_s: 30      # also print if this many seconds passed since the last line

# Hard cap on the TOTAL time batch_chat may spend. On expiry, in-flight requests are
# abandoned and their rows return (False, ...) -> those questions simply keep their
# original rollouts (summarize-replace already supports "no candidate"), so training
# proceeds instead of blocking. 0 = unlimited (the old, unbounded behavior).
wall_clock_budget: 900  # seconds

# The teacher template's {style_example_1} is filled at TRAINING time with the target
# model's own incorrect on-policy rollout for the SAME question (picked from the current
# batch), so there is no style-pool config here.
#
# That rollout can be as long as data.max_response_length (10240), and the prompt already
# carries the problem plus the full reference reasoning — a 10k-token attempt on top of
# that bloats the request, can overflow the teacher's context / KV cache, and slows
# prefill. Cap it here. Truncation keeps the HEAD of the attempt: the template asks for
# "the longest valid initial prefix", and errors usually appear later in the rollout, so
# the tail is the cheapest part to drop. Counted in TOKENS (cut on ids before decoding),
# so the bound is exact. 0 or negative disables the cap.
max_attempt_tokens: 4096

# --- what the teacher is asked to produce ---
# rewrite  (legacy): {style_example_1} gets the WHOLE attempt and the teacher returns a
#          complete corrected solution, which becomes the response verbatim.
# continue         : {style_example_1} gets only the leading attempt_prefix_ratio_*
#          fraction of the attempt (cut at a sentence boundary) and the teacher returns
#          just a CONTINUATION. The trainer splices [student_prefix, continuation] into
#          one response, so the prompt template must ask for a continuation only (see
#          TEACHER_TEMPLATE_DEFAULT1 in Data/prepare_summarize_prompts.py) — pairing
#          'continue' with a rewrite-style template makes the teacher restate the prefix
#          and the spliced response ends up with it twice.
#
# LOSS SHAPE (continue only): the prefix tokens were sampled by the POLICY itself under
# the short prompt, so they get prefix_mask=0 (on-policy branch); only the teacher's
# continuation gets prefix_mask=1 (off-policy branch). The prefix rows' old_log_probs
# therefore come from the post-splice forward pass rather than the sampling-time
# distribution — the same-step drift is negligible (ratio ~= 1).
teacher_mode: rewrite   # rewrite | continue

# Fraction of the student's rollout kept as the prefix in 'continue' mode. Each candidate
# row samples its own ratio uniformly from [min, max], so K>1 gives different cut points.
# The cut is then backed up to the last sentence boundary: a prefix ending mid-sentence
# makes a style-consistent continuation much harder. Ignored when teacher_mode=rewrite.
attempt_prefix_ratio_min: 0.2
attempt_prefix_ratio_max: 0.3
