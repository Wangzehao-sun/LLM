# Joint decoding as the source of the summarize-replacement (SR) candidate.
#
# The ACTOR BEING TRAINED is the student and a frozen teacher constrains it. Every token
# must sit in both models' top-k and clear both probability floors; among the survivors the
# student's own distribution decides. The resulting response replaces one of the n GRPO
# rollouts.
#
# HOW IT REACHES THE LOSS. Because the student IS the actor, the density the candidate was
# sampled from is the actor's own -- which compute_log_prob already produces for the whole
# batch. So nothing is substituted for old_log_probs and the importance ratio
#
#     r_t = pi_theta(y_t) / p_t(y_t)
#
# comes out of the framework untouched. What the sampler contributes is the one quantity no
# later forward pass can recover: Z_t = p_t / mu_t, the token-level cost of the teacher's
# constraint (mu_t being the truncated, renormalised distribution actually sampled from).
#
# It multiplies the off-policy term AFTER clipping:
#
#     L_off = -Z_t * min( r_t * A_t , clip(r_t, 1-eps, 1+eps) * A_t )
#
# Keeping Z_t OUTSIDE the ratio is the point: folded in, the clip would fire for reasons
# unrelated to how far the policy has moved, which is all it is meant to police. That is the
# 'clip_without_z' setting of actor_rollout_ref.actor.policy_loss.off_policy_reshape ('clip'
# is the same thing). 'clip_with_z' folds Z_t into the denominator instead (r = pi_theta/mu_t,
# the textbook IS ratio) so the clip sees it -- the A/B this knob exists for.
#
# THE CHECK: before the first optimizer step, numerator and denominator are the same model
# under the same prompt at the same temperature, so actor/off_ratio on the off rows must sit
# at 1.0, with Z_t reported separately as actor/off_z_mean. A frozen student would instead
# add a model gap that widens as training proceeds -- silently decaying ESS.
#
# off_old_log_probs is never written on this path, and the swap that would overwrite the off
# rows' denominator must not run -- old_log_probs is already correct. Asserted at the swap
# site, since a placeholder column there would zero the denominator and pass every other guard.
#
# Runs on the reasoner's OWN GPUs, as a method on the actor worker
# (NewActorRolloutRefWorker.generate_joint), after the rollout when vLLM is asleep. There is
# no separate resource pool and no separate worker: only the process holding the actor's FSDP
# module can read its logits token by token.
#
# This file holds every knob. It is loaded EXPLICITLY by the trainer rather than composed
# through Hydra's `defaults:`, which is what keeps ppo_trainer.yaml unmodified -- with
# `enable: False` (the default) nothing happens and every existing script behaves
# byte-identically. Override from the command line with `+joint_decode.<key>=<value>`;
# those win over the values here.
#
# See examples/custom/train_hype_summarize_joint.sh for a working invocation, and
# verl/custom/joint_decode_core.py for what the fusion rules actually compute.

# False changes nothing: no teacher is loaded and the SR path keeps its existing sources.
enable: False

# ---------------------------------------------------------------------------
# the teacher (the student is the actor, so it needs no path)
# ---------------------------------------------------------------------------

# The model that steers. Frozen, plain HF (never FSDP-wrapped -- it takes no gradient, and
# sharding it would mean an all-gather per layer per token). Reads the long summarize prompt
# by default, so it guides from information the actor does not have.
#
# Must share the ACTOR's vocabulary. The requirement is stricter than the rephraser's, which
# only exchanges token ids: per-token fusion compares the two models' logits index by index,
# so a mismatch fuses unrelated tokens and produces fluent nonsense with no error anywhere.
# generate_joint compares the vocabularies against the actor's tokenizer and refuses to start.
teacher_model_path: null

trust_remote_code: True

# Keep the teacher on CPU between steps, moving it to GPU only while decoding. ~8GB over
# PCIe per step for a 4B model (~1-2s), which is negligible against thousands of sequential
# decode steps -- and it leaves gpu_memory_utilization alone.
#
# False keeps it resident: no transfer, but its memory competes with the arena vLLM reserved
# up front, so gpu_memory_utilization has to come down to match.
teacher_offload: True

# ---------------------------------------------------------------------------
# fusion rule
# ---------------------------------------------------------------------------

# agree       -- teacher constrains the token set, student chooses inside it. This is the
#                method; the other three are baselines kept because the core supports
#                them for free.
# linear      -- geometric mixture of the two distributions (weight = fuse_weight).
# contrastive -- extrapolate along teacher-minus-student (proxy tuning / DExperts).
# max         -- elementwise max, then renormalise.
fuse: agree

# Only read by linear/contrastive. 0.0 reduces exactly to the student alone, which is the
# degenerate case worth keeping available: with temperature 0 it must reproduce the
# student's greedy output token for token.
fuse_weight: 0.5

# How far down the STUDENT's own ranking it may look for a token the teacher permits.
# Raising this lets it reach further instead of falling back, WITHOUT widening what the
# teacher allows -- usually the cheapest response to a high fallback rate.
agree_student_top_k: 50

# How much of the vocabulary the TEACHER permits at all. This is the knob that sets how
# tightly the constraint binds.
agree_teacher_top_k: 10

# Probability floors, applied on top of the top-k intersection. 0 disables a side.
# The teacher's floor sets how wide the allowed region is; the student's only drops
# tokens it would itself be very reluctant to emit.
agree_teacher_min_prob: 0.05
agree_student_min_prob: 0.0

# Who decides when the intersection comes out EMPTY. These are different experiments,
# not two spellings of one:
#   teacher -- the teacher overrides exactly where the student disagrees with it.
#              A fallback rate near 1.0 means the run is plain teacher decoding.
#   student -- the teacher only ever CONSTRAINS, never overrides. The text stays in the
#              student's voice, and a high fallback rate degenerates toward plain student
#              decoding instead. Also flips how the fallback metric should be read.
# Both branches SAMPLE (at `temperature`) rather than take an argmax: an argmax fallback
# would pin every disagreeing position to one fixed token, so diversity would decay with
# each fallback.
agree_fallback: student

# ---------------------------------------------------------------------------
# sampling
# ---------------------------------------------------------------------------

# Should normally MATCH actor_rollout_ref.rollout.temperature. The loss's numerator is
# computed at that temperature (compute_log_prob divides logits by it), so a mismatch
# puts a systematic bias into off_ratio that nothing downstream reports.
temperature: 1.0

top_p: 1.0

# -1 disables. Under `fuse: agree` the intersection already bounds the candidate set, so
# this is redundant there and left off.
top_k: -1

# ---------------------------------------------------------------------------
# throughput
# ---------------------------------------------------------------------------

# Cap on generated tokens. The per-step cost is
#   ceil(W / n_gpus) * max_new_tokens
# sequential two-model forwards, where W is the number of questions this step and n_gpus is
# the reasoner's count (this shares its pool). There is no paged attention and no CUDA graph
# here, so that product is the whole story.
max_new_tokens: 8192

# Rows decoded concurrently per rank. Bounded by memory, not by the question count. What
# binds: the actor's params are UNSHARDED for the duration (summon_full_params(recurse=True)
# -- which is what keeps the per-token cost off the interconnect, see joint_decode_core.py),
# the teacher sits alongside, and both models' KV caches grow with this number times
# max_new_tokens.
batch_size: 16

# Hard cap on questions per step, applied AFTER wrong_only narrows the set. This exists
# because the cost above is linear in W and W is data-dependent -- a step where most
# rollouts failed would otherwise stall the run. What gets dropped is logged, never
# silently truncated.
#
# 0 = no cap. Only sensible with wrong_only; summarize_replace=all sends every question
# here and is not viable at these lengths.
max_questions_per_step: 0

# Candidates per question, as an UPPER bound. 1 (default) keeps the old behaviour exactly.
#
# The decode is bandwidth-bound: every step streams both models' weights from HBM whatever
# the row count, so a batch of 16 costs about what 32 does. A step where only 20 questions
# failed therefore leaves most rows idle, and filling them with extra candidates is nearly
# free -- more shots at one that is both correct and format-valid, which is what
# batch/sr_accepted measures.
#
# K is derived per step as target_rows // n_questions, clamped to [1, max_k], so it is >1
# only when questions are scarce. The trade-off when it does apply: the question cap becomes
# target_rows // K, so a busy step covers proportionally fewer questions -- which is why this
# defaults to 1 rather than to the row budget.
#
# Watch batch/sr_joint_k (the K actually used) and batch/sr_joint_rows (W*K).
max_k: 1

# Rows to aim for when deriving K. 0 = batch_size * n_gpus, the whole budget. Clamped to that
# budget in any case, since it cannot decode rows the GPUs cannot hold.
#
# Set it BELOW the budget to cap the extra candidates: with batch_size=16 on 4 GPUs the budget
# is 64, so target_rows=32 means a 16-question step gets K=2 rather than K=4.
target_rows: 0

# auto tries flash_attention_2, then sdpa, then eager, and says which it got. Pin it to
# fail loudly instead if a specific backend is required.
attn_impl: auto

# How often to check whether every row has finished, and to drop finished rows from the
# batch. Each check is a host sync that drains the CUDA queue, so doing it every step
# costs more than the few all-padding steps a coarser cadence may run.
eos_check_every: 16

# Drop finished rows from the batch mid-decode. Response lengths vary enormously, and a
# carried-but-finished row still pays its share of the KV read, which dominates a step at
# these lengths.
shrink_batch: True

# ---------------------------------------------------------------------------
# which prompt each side reads
# ---------------------------------------------------------------------------

# short -- the original question, the same prompt the loss uses.
# long  -- the pre-rendered summarize prompt (data.use_summarize must be on).
#
# The default pairing is the method: the teacher steers from the information-richer long
# prompt while the student decodes under the short one the gradient will be taken at.
#
# Leave student_prompt at 'short'. It is what makes actor/off_ratio come out at 1.0 before the
# first update, since the loss recomputes the numerator under the short prompt; setting it to
# 'long' would put a prompt shift into the ratio and give up the only end-to-end check this
# path has.
student_prompt: short
teacher_prompt: long
